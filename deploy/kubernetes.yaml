apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flexidim-config
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flexidim-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flexidim-web
  template:
    metadata:
      labels:
        app: flexidim-web
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: flexidim-web
          image: flexidim-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /api/workspace
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: flexidim-config
---
apiVersion: v1
kind: Service
metadata:
  name: flexidim-web
spec:
  selector:
    app: flexidim-web
  ports:
    - name: http
      port: 3000
      targetPort: http
